name: AntiScam Guardian dependency security audit

on:
  pull_request:
    branches:
      - main
      - commercial-readiness-026
      - release/customer-readiness
      - free-unlimited-20261122
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "Dockerfile"
      - ".github/workflows/security-audit.yml"
  push:
    branches:
      - main
      - commercial-readiness-026
      - release/customer-readiness
      - free-unlimited-20261122
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "Dockerfile"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct bundled application source
        shell: bash
        run: |
          set -euo pipefail
          test -s payload/release-0.2.4.tar.xz.b64.part00
          cat payload/release-0.2.4.tar.xz.b64.part* | base64 -d > release.tar.xz
          mkdir release
          tar -xJf release.tar.xz -C release
          test -s release/anti-scam-guardian/requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit Python dependency tree
        working-directory: release/anti-scam-guardian
        run: |
          python -m pip install --upgrade pip pip-audit
          printf '\ncryptography>=50,<51\n' >> requirements.txt
          pip-audit -r requirements.txt

  javascript-dependencies:
    name: Audit Mini App dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct bundled application source
        shell: bash
        run: |
          set -euo pipefail
          test -s payload/release-0.2.4.tar.xz.b64.part00
          cat payload/release-0.2.4.tar.xz.b64.part* | base64 -d > release.tar.xz
          mkdir release
          tar -xJf release.tar.xz -C release
          test -s release/anti-scam-guardian/web/package.json
          cp overlays/web/wallet-removal.js release/anti-scam-guardian/web/src/wallet-removal.js
          cp overlays/web/remove-wallet-connect.mjs release/anti-scam-guardian/web/remove-wallet-connect.mjs
          cd release/anti-scam-guardian/web
          node remove-wallet-connect.mjs

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit Mini App dependency tree
        working-directory: release/anti-scam-guardian/web
        run: |
          npm install --no-audit --no-fund
          if npm ls --all @tonconnect/ui; then
            echo "TON Connect SDK is still installed" >&2
            exit 1
          fi
          npm audit --audit-level=high

  python-static-analysis:
    name: Static security analysis for Python application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct and apply production overlays
        shell: bash
        run: |
          set -euo pipefail
          cat payload/release-0.2.4.tar.xz.b64.part* | base64 -d > release.tar.xz
          mkdir release
          tar -xJf release.tar.xz -C release
          cp overlays/app/scanner.py release/anti-scam-guardian/app/scanner.py
          cp overlays/app/backup_supervisor.py release/anti-scam-guardian/app/backup_supervisor.py
          cp overlays/app/restore_backup.py release/anti-scam-guardian/app/restore_backup.py
          cp overlays/app/apply_product_limits_patch.py release/anti-scam-guardian/apply_product_limits_patch.py
          cp overlays/app/apply_free_mode_patch.py release/anti-scam-guardian/apply_free_mode_patch.py
          cp overlays/app/apply_wallet_removal_patch.py release/anti-scam-guardian/apply_wallet_removal_patch.py
          cp overlays/app/runtime_security_patch.py release/anti-scam-guardian/app/runtime_security_patch.py
          cp overlays/tests/test_runtime_security_patch.py release/anti-scam-guardian/tests/test_runtime_security_patch.py
          python -V

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Bandit security checks
        working-directory: release/anti-scam-guardian
        run: |
          python -m pip install --upgrade pip bandit
          python apply_product_limits_patch.py app/config.py app/database.py app/main.py
          python apply_free_mode_patch.py app/bot.py
          python apply_wallet_removal_patch.py app
          python app/runtime_security_patch.py app/runtime.py
          if grep -q -- '--forwarded-allow-ips' app/runtime.py; then echo 'Wildcard proxy trust remains enabled' >&2; exit 1; fi
          if grep -RniE --exclude-dir=static 'TonConnectUI|tonconnect-manifest|@tonconnect/ui|/tonconnect-manifest' app; then
            echo "A backend wallet-connection endpoint or manifest remains" >&2
            exit 1
          fi
          python -m unittest discover -s tests -p 'test_runtime_security_patch.py' -v
          echo '--- all Bandit findings, including low severity (informational) ---'
          bandit -r app -l -ii -f txt || true
          echo '--- release gate: no medium/high confidence findings ---'
          bandit -r app -ll -ii -f txt

  product-feature-audit:
    name: Inspect archived product flows for free/unlimited release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct and inspect product paths
        shell: bash
        run: |
          set -euo pipefail
          cat payload/release-0.2.4.tar.xz.b64.part* | base64 -d > release.tar.xz
          mkdir release
          tar -xJf release.tar.xz -C release
          python - <<'PY'
          from pathlib import Path
          root = Path("release/anti-scam-guardian")
          ranges = {
              "app/config.py": [(1, 110)],
              "app/database.py": [(105, 160)],
              "app/main.py": [(105, 195)],
              "app/bot.py": [(55, 115), (210, 250)],
              "web/src/main.js": [(1, 180)],
              "web/index.html": [(1, 220)],
          }
          for rel, spans in ranges.items():
              path = root / rel
              if not path.exists():
                  continue
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              print(f"\n===== {rel} ({len(lines)} lines) =====")
              for first, last in spans:
                  print(f"--- lines {first}-{min(last, len(lines))} ---")
                  for index in range(first-1, min(last, len(lines))):
                      print(f"{index+1}: {lines[index]}")
          PY
