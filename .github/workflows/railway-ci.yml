name: AntiScam Guardian release verification

on:
  push:
    branches:
      - main
      - release-readiness-025
      - commercial-readiness-026
      - payment-hardening-026
      - test/telegram-stars-payment-guards-2026-11-05
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "Dockerfile"
      - "railway.json"
      - "README.md"
      - "RAILWAY-DEPLOY-fa.md"
      - "PRELAUNCH-CHECKLIST-fa.md"
      - ".github/workflows/railway-ci.yml"
  pull_request:
    branches:
      - main
      - commercial-readiness-026
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "Dockerfile"
      - "railway.json"
      - "README.md"
      - "RAILWAY-DEPLOY-fa.md"
      - "PRELAUNCH-CHECKLIST-fa.md"
      - ".github/workflows/railway-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and reconstruct source archive
        run: |
          set -eu
          test -s payload/release-0.2.4.tar.xz.b64.part00
          cat payload/release-0.2.4.tar.xz.b64.part* | base64 -d > release.tar.xz
          mkdir release
          tar -xJf release.tar.xz -C release
          test -f release/anti-scam-guardian/app/runtime.py
          test -f release/anti-scam-guardian/app/main.py
          cp overlays/app/scanner.py release/anti-scam-guardian/app/scanner.py
          cp overlays/app/backup_supervisor.py release/anti-scam-guardian/app/backup_supervisor.py
          cp overlays/app/restore_backup.py release/anti-scam-guardian/app/restore_backup.py
          cp overlays/tests/test_backup_supervisor.py release/anti-scam-guardian/tests/test_backup_supervisor.py
          cp overlays/tests/test_scanner_release.py release/anti-scam-guardian/tests/test_scanner_release.py
          cp overlays/tests/test_database_refund.py release/anti-scam-guardian/tests/test_database_refund.py
          cp overlays/app/apply-database-refund-patch.py release/anti-scam-guardian/apply-database-refund-patch.py
          cp overlays/app/apply_bot_operator_patch.py release/anti-scam-guardian/apply_bot_operator_patch.py
          cp overlays/tests/test_bot_operator_patch.py release/anti-scam-guardian/tests/test_bot_operator_patch.py
          cp overlays/tests/test_payment_protocol.py release/anti-scam-guardian/tests/test_payment_protocol.py
          cp overlays/tests/test_telegram_auth_release.py release/anti-scam-guardian/tests/test_telegram_auth_release.py
          cp overlays/web/result-metadata.js release/anti-scam-guardian/web/src/result-metadata.js
          cp overlays/web/wallet-policy-note.js release/anti-scam-guardian/web/src/wallet-policy-note.js
          cp overlays/tests/test_wallet_policy_note.mjs release/anti-scam-guardian/tests/test_wallet_policy_note.mjs
          cp overlays/web/apply-result-metadata.mjs release/anti-scam-guardian/web/apply-result-metadata.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: release/anti-scam-guardian
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "cryptography>=42,<48"

      - name: Compile and test backend
        working-directory: release/anti-scam-guardian
        run: |
          python apply-database-refund-patch.py app/database.py
          python apply_bot_operator_patch.py app/bot.py
          python -m compileall -q app tests apply_bot_operator_patch.py
          python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Mini App
        working-directory: release/anti-scam-guardian/web
        run: |
          node --test ../tests/test_wallet_policy_note.mjs
          node apply-result-metadata.mjs
          npm install --no-audit --no-fund
          npm run build
          test -f ../app/static/index.html

      - name: Build production Docker image
        run: docker build -t anti-scam-guardian:release-readiness .
