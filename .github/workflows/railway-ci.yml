name: AntiScam Guardian release verification

on:
  push:
    branches:
      - main
      - release-readiness-025
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "Dockerfile"
      - "railway.json"
      - ".github/workflows/railway-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "Dockerfile"
      - "railway.json"
      - ".github/workflows/railway-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and reconstruct source archive
        run: |
          set -eu
          test -s payload/release-0.2.4.tar.xz.b64.part00
          cat payload/release-0.2.4.tar.xz.b64.part* | base64 -d > release.tar.xz
          mkdir release
          tar -xJf release.tar.xz -C release
          test -f release/anti-scam-guardian/app/main.py

      - name: Inspect archived source interfaces for release compatibility
        working-directory: release/anti-scam-guardian
        run: |
          echo "===== SCANNER.PY ====="
          cat app/scanner.py
          echo "===== RUNTIME.PY ====="
          if [ -f app/runtime.py ]; then cat app/runtime.py; else echo "NO app/runtime.py"; fi
          echo "===== MAIN.PY ====="
          sed -n '1,240p' app/main.py
          echo "===== CONFIG.PY ====="
          sed -n '1,200p' app/config.py
          echo "===== TEST SCANNER IMPORTS ====="
          sed -n '1,180p' tests/test_scanner.py
          echo "===== TEST API IMPORTS ====="
          sed -n '1,80p' tests/test_api.py

      - name: Apply release overlay and regression tests
        run: |
          cp overlays/app/scanner.py release/anti-scam-guardian/app/scanner.py
          cp overlays/tests/test_scanner_release.py release/anti-scam-guardian/tests/test_scanner_release.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: release/anti-scam-guardian
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "uvicorn>=0.30,<1"

      - name: Compile and test backend
        working-directory: release/anti-scam-guardian
        run: |
          python -m compileall -q app tests
          python -m py_compile "$GITHUB_WORKSPACE/overlays/service_supervisor.py"
          python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Mini App
        working-directory: release/anti-scam-guardian/web
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f ../app/static/index.html

      - name: Build production Docker image
        run: docker build -t anti-scam-guardian:release-readiness .
