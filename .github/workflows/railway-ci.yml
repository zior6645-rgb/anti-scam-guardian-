name: AntiScam Guardian release verification

on:
  push:
    branches:
      - main
      - release-readiness-025
      - commercial-readiness-026
      - payment-hardening-026
      - test/telegram-stars-payment-guards-2026-11-05
      - product/market-ready-20261105
      - release/customer-readiness

    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "scripts/**"
      - "Dockerfile"
      - "railway.json"
      - "README.md"
      - "RAILWAY-DEPLOY-fa.md"
      - "CUSTOMER-READINESS.md"
      - "REBUILD.md"
      - "PAYMENT-TEST-REPORT-fa.md"
      - "PRELAUNCH-CHECKLIST-fa.md"
      - ".github/workflows/railway-ci.yml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches:
      - main
      - commercial-readiness-026
      - product/market-ready-20261105
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "scripts/**"
      - "Dockerfile"
      - "railway.json"
      - "README.md"
      - "RAILWAY-DEPLOY-fa.md"
      - "CUSTOMER-READINESS.md"
      - "REBUILD.md"
      - "PAYMENT-TEST-REPORT-fa.md"
      - "PRELAUNCH-CHECKLIST-fa.md"
      - ".github/workflows/railway-ci.yml"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reconstruct and patch release sources
        run: python scripts/reconstruct.py release

      - name: Install backend dependencies
        working-directory: release/anti-scam-guardian
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "cryptography>=50,<51"

      - name: Compile and test backend
        working-directory: release/anti-scam-guardian
        run: |
          python -m compileall -q app tests apply_bot_operator_patch.py apply_product_limits_patch.py
          python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Mini App
        working-directory: release/anti-scam-guardian/web
        run: |
          node --test ../tests/*.mjs
          npm install --no-audit --no-fund
          node patch-deepmerge-security.mjs
          node test-deepmerge-security.mjs
          node apply-result-metadata.mjs
          node apply-result-metadata.mjs
          npm run build
          test -f ../app/static/index.html

      - name: Build production Docker image
        run: docker build -t anti-scam-guardian:release-readiness .
