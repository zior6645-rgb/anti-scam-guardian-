name: AntiScam Guardian release verification

on:
  push:
    branches:
      - main
      - release-readiness-025
      - commercial-readiness-026
      - payment-hardening-026
      - test/telegram-stars-payment-guards-2026-11-05
      - product/market-ready-20261105
      - release/customer-readiness
      - free-unlimited-20261122
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "scripts/**"
      - "Dockerfile"
      - "railway.json"
      - "README.md"
      - "RAILWAY-DEPLOY-fa.md"
      - "CUSTOMER-READINESS.md"
      - "REBUILD.md"
      - "PRELAUNCH-CHECKLIST-fa.md"
      - ".github/workflows/railway-ci.yml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches:
      - main
      - commercial-readiness-026
      - product/market-ready-20261105
      - release/customer-readiness
    paths:
      - "payload/release-0.2.4.tar.xz.b64.part*"
      - "overlays/**"
      - "scripts/**"
      - "Dockerfile"
      - "railway.json"
      - "README.md"
      - "RAILWAY-DEPLOY-fa.md"
      - "CUSTOMER-READINESS.md"
      - "REBUILD.md"
      - "PRELAUNCH-CHECKLIST-fa.md"
      - ".github/workflows/railway-ci.yml"
      - ".github/workflows/security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reconstruct and patch release sources
        run: python scripts/reconstruct.py release

      - name: Install backend dependencies
        working-directory: release/anti-scam-guardian
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "cryptography>=50,<51"

      - name: Compile and test backend
        working-directory: release/anti-scam-guardian
        run: |
          python -m compileall -q app tests apply_free_mode_patch.py apply_product_limits_patch.py apply_wallet_removal_patch.py apply_history_deletion_patch.py
          python -m unittest discover -s tests -v
          if grep -RniE --exclude-dir=static 'TonConnectUI|tonconnect-manifest|@tonconnect/ui|/tonconnect-manifest' app; then
            echo "A backend wallet-connection endpoint or manifest remains" >&2
            exit 1
          fi
          test ! -e app/static/tonconnect-manifest.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Mini App
        working-directory: release/anti-scam-guardian/web
        run: |
          node --test ../tests/*.mjs
          node ./remove-wallet-connect.mjs
          npm install --no-audit --no-fund
          node apply-result-metadata.mjs
          node apply-result-metadata.mjs
          node apply-free-unlimited.mjs
          node remove-wallet-connect.mjs
          node apply-history-management.mjs
          npm run build
          test -f ../app/static/index.html
          if grep -RniE 'TonConnectUI|tonconnect-manifest|@tonconnect/ui|ton-connect|wallet-status|wallet-policy-note' ../app/static; then
            echo "A wallet-connect UI or SDK reference remains in the built Mini App" >&2
            exit 1
          fi

      - name: Build production Docker image
        run: docker build -t anti-scam-guardian:release-readiness .
